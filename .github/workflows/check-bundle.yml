name: Skill bundle checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check publication tree
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python -X utf8 scripts/check_publication.py --tree HEAD
      - name: Check publication tree and release version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -X utf8 scripts/check_publication.py --tree HEAD --release-tag "$RELEASE_TAG"
      - run: python -X utf8 -m pip install -r requirements-dev.txt
      - run: python -X utf8 scripts/validate_bundle.py
      - name: Run top-level and specialist tests with skip reasons
        run: python -X utf8 -m pytest -ra tests skills/schematic-analyzer/tests skills/hardware-project-library/tests
      - run: python -X utf8 skills/hardware/scripts/hardware_tool.py list --json
